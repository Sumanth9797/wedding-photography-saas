# Server Configuration
server.port=8080
spring.application.name=wedding-photography-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/wedding_photography?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-long-enough}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.gallery-token-expiration=${JWT_GALLERY_EXPIRATION:3600000}

# OTP Configuration
otp.expiry-minutes=10
otp.length=6

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET:wedding-photography-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}
aws.cloudfront.domain=${CLOUDFRONT_DOMAIN:}
aws.s3.presigned-url-expiry-minutes=60

# Twilio Configuration (SMS/WhatsApp)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@weddingphotography.com}

# Application URL
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.gallery-url=${APP_GALLERY_URL:http://localhost:3000/gallery}

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.weddingphotography=INFO
logging.level.org.springframework.security=WARN

# Cache
spring.cache.type=simple

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
