# ===========================
# DEV PROFILE - No external dependencies needed
# Run with: mvn spring-boot:run -Dspring.profiles.active=dev
# ===========================

# H2 In-Memory Database (no MySQL required)
spring.datasource.url=jdbc:h2:mem:wedsnap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local File Storage (no AWS S3 required)
storage.local.enabled=true
storage.local.path=./uploads
app.base-url=http://localhost:8080
app.gallery-url=http://localhost:5173/gallery

# Console OTP (no email/SMS setup required)
notification.console.enabled=true

# Disable mail auto-config errors
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT
jwt.secret=dev-secret-key-for-local-development-must-be-at-least-256-bits-long
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.weddingphotography=DEBUG
